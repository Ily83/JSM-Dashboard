# SonarQube analysis of the Alert Center.
#   npm run test:coverage                     writes coverage/lcov.info
#   sonar-scanner (or the sonar-scanner-cli Docker image) with SONAR_HOST_URL and SONAR_TOKEN
# The token never goes in this file.
sonar.projectKey=jsm-dashboard
sonar.projectName=Jira Operations - Alert Center
sonar.sourceEncoding=UTF-8
sonar.sources=src,server,shared,scripts
sonar.tests=tests,e2e
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,test-results/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
